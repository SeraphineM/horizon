<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="960" height="545" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a52a2a"/>
    </marker>
  </defs>

  <!-- feedback loop closure -->
  <path d="M 805,180 V 20 H 190 V 180" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="14" text-anchor="middle" font-size="14" font-weight="bold">Feedback — information about outcomes returns to citizens &amp; institutions</text>

  <!-- throughput title -->
  <text x="490" y="45" text-anchor="middle" font-size="16" font-weight="bold">Throughput — information conversion</text>

  <!-- boundary circle, centre (490,220) radius 130 -->
  <circle cx="490" cy="220" r="130" fill="#7a4fb5" fill-opacity="0.04" stroke="#7a4fb5" stroke-opacity="0.5" stroke-width="1.4"/>

  <!-- balance scale inside the throughput circle: the informationalism contest -->
  <text x="455" y="190" text-anchor="middle" font-size="11" font-weight="bold">Who controls information?</text>
  <line x1="490" y1="196" x2="490" y2="214" stroke="#555" stroke-width="1.6"/>
  <polygon points="480,214 500,214 490,196" fill="#666"/>
  <line x1="438" y1="196" x2="542" y2="196" stroke="#333" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="438" y1="196" x2="438" y2="222" stroke="#2e7d32" stroke-width="1.4"/>
  <line x1="542" y1="196" x2="542" y2="222" stroke="#a52a2a" stroke-width="1.4"/>
  <path d="M 423,222 Q 438,236 453,222" fill="#e7f3e9" stroke="#2e7d32" stroke-width="1.6"/>
  <path d="M 527,222 Q 542,236 557,222" fill="#fbe9e7" stroke="#a52a2a" stroke-width="1.6"/>
  <text x="438" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">open</text>
  <text x="542" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#a52a2a">closed</text>

  <!-- input / output boxes -->
  <rect x="110" y="180" width="160" height="80" rx="10" fill="#e8ecfa" stroke="#33509b" stroke-width="1.3"/>
  <text x="190" y="210" text-anchor="middle" font-size="16" font-weight="bold">Input</text>
  <text x="190" y="232" text-anchor="middle" font-size="12">demands, support</text>

  <rect x="710" y="180" width="190" height="80" rx="10" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.3"/>
  <text x="805" y="210" text-anchor="middle" font-size="16" font-weight="bold">Output</text>
  <text x="805" y="232" text-anchor="middle" font-size="12">regulation, extraction,</text>
  <text x="805" y="247" text-anchor="middle" font-size="12">distribution</text>

  <!-- connectors input/output to the ring (stop exactly at node edges) -->
  <line x1="270" y1="220" x2="288" y2="220" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 676,278 Q 693,255 708,233" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- external shocks -->
  <line x1="15" y1="140" x2="145" y2="185" stroke="#666" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="15" y="115" font-size="12" font-weight="bold">External shocks</text>
  <text x="15" y="130" font-size="12">(social, economic,</text>
  <text x="15" y="145" font-size="12">environmental)</text>

  <!-- seven throughput functions (Almond &amp; Powell 1966), positioned on a ring around the centre -->
  <g>
    <rect x="290" y="195" width="120" height="50" rx="8" fill="#e8ecfa" stroke="#33509b" stroke-width="1.3"/>
    <text x="350" y="216" text-anchor="middle" font-size="13" font-weight="bold">Participation</text>
    <text x="350" y="232" text-anchor="middle" font-size="10">elections</text>
  </g>
  <g>
    <rect x="343" y="86" width="120" height="50" rx="8" fill="#e8ecfa" stroke="#33509b" stroke-width="1.3"/>
    <text x="403" y="104" text-anchor="middle" font-size="13" font-weight="bold">Socialisation</text>
    <text x="403" y="120" text-anchor="middle" font-size="10">civic education</text>
  </g>
  <g>
    <rect x="461" y="59" width="120" height="50" rx="8" fill="#e8ecfa" stroke="#33509b" stroke-width="1.3"/>
    <text x="521" y="80" text-anchor="middle" font-size="13" font-weight="bold">Aggregation</text>
    <text x="521" y="96" text-anchor="middle" font-size="10">parties</text>
  </g>
  <g>
    <rect x="556" y="134" width="120" height="50" rx="8" fill="#f2ecfa" stroke="#7a4fb5" stroke-width="1.3"/>
    <text x="616" y="155" text-anchor="middle" font-size="13" font-weight="bold">Communication</text>
    <text x="616" y="171" text-anchor="middle" font-size="10">media</text>
  </g>
  <g>
    <rect x="556" y="256" width="120" height="50" rx="8" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.3"/>
    <text x="616" y="277" text-anchor="middle" font-size="13" font-weight="bold">Policymaking</text>
    <text x="616" y="293" text-anchor="middle" font-size="10">legislature</text>
  </g>
  <g>
    <rect x="461" y="332" width="120" height="50" rx="8" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.3"/>
    <text x="521" y="350" text-anchor="middle" font-size="13" font-weight="bold">Power</text>
    <text x="521" y="364" text-anchor="middle" font-size="9">executive,</text>
    <text x="521" y="376" text-anchor="middle" font-size="9">government reporting</text>
  </g>
  <g>
    <rect x="343" y="304" width="120" height="50" rx="8" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.3"/>
    <text x="403" y="325" text-anchor="middle" font-size="13" font-weight="bold">Adjudication</text>
    <text x="403" y="341" text-anchor="middle" font-size="10">judiciary</text>
  </g>

  <!-- legend: what the balance scale means -->
  <path d="M 335,398 Q 343,404 351,398" fill="#e7f3e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="368" y="404" font-size="12" fill="#2e7d32">open, accountable authority over information -&gt; reinforces resilience</text>
  <path d="M 335,420 Q 343,426 351,420" fill="#fbe9e7" stroke="#a52a2a" stroke-width="1.6"/>
  <text x="368" y="426" font-size="12" fill="#a52a2a">closed, captured authority over information -&gt; erodes resilience</text>

  <!-- legend: the three components (single column, stacked) -->
  <line x1="175" y1="460" x2="960" y2="460" stroke="#ccc" stroke-width="1"/>
  <rect x="175" y="472" width="16" height="16" rx="3" fill="#e8ecfa" stroke="#33509b" stroke-width="1.2"/>
  <text x="200" y="484" font-size="12" fill="#33509b">Informational Autonomy -- participation, socialisation, aggregation (citizens' input)</text>
  <rect x="175" y="496" width="16" height="16" rx="3" fill="#f2ecfa" stroke="#7a4fb5" stroke-width="1.2"/>
  <text x="200" y="508" font-size="12" fill="#7a4fb5">Informational Integrity -- communication (media)</text>
  <rect x="175" y="518" width="16" height="16" rx="3" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.2"/>
  <text x="200" y="530" font-size="12" fill="#3d7a44">Informational Accountability -- policymaking, power, adjudication (institutional output)</text>
</svg>
