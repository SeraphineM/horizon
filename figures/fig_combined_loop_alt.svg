<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Georgia, 'Times New Roman', serif">
  <rect x="0" y="0" width="1000" height="680" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="500" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#3d2566">How AI Transforms Democratic Resilience</text>

  <!-- feedback loop: squared arrow around the whole throughput block -->
  <path d="M 905,335 V 85 H 95 V 335" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#666">feedback --- the loop informational resilience of democracy depends on closing</text>

  <!-- Informational Integrity: a taller, narrower arch closing at each box's outer top corner -->
  <path d="M 150,290 C 280,130 460,95 500,95 C 540,95 720,130 850,290"
        fill="#7a4fb5" fill-opacity="0.08" stroke="#7a4fb5" stroke-width="3"/>
  <text x="500" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4fb5">Informational Integrity</text>
  <text x="500" y="168" text-anchor="middle" font-size="12" fill="#555">Communication (media)</text>
  <text x="500" y="185" text-anchor="middle" font-size="10.5" fill="#777">the shared environment between autonomy and accountability</text>

  <!-- Informational Autonomy and Informational Accountability, side by side -->
  <rect x="150" y="290" width="340" height="130" fill="#e8ecfa" stroke="#33509b" stroke-width="1.4"/>
  <text x="320" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#33509b">Informational Autonomy</text>
  <text x="320" y="342" text-anchor="middle" font-size="12">Participation (elections)</text>
  <text x="320" y="361" text-anchor="middle" font-size="12">Socialisation (civic education)</text>
  <text x="320" y="380" text-anchor="middle" font-size="12">Aggregation (parties)</text>

  <rect x="510" y="290" width="340" height="130" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.4"/>
  <text x="680" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d7a44">Informational Accountability</text>
  <text x="680" y="342" text-anchor="middle" font-size="12">Policymaking (legislature)</text>
  <text x="680" y="361" text-anchor="middle" font-size="12">Power (executive)</text>
  <text x="680" y="380" text-anchor="middle" font-size="12">Adjudication (judiciary)</text>

  <!-- Input box: feeds into Autonomy -->
  <rect x="20" y="320" width="120" height="70" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="80" y="350" text-anchor="middle" font-size="14" font-weight="bold">Input</text>
  <text x="80" y="369" text-anchor="middle" font-size="10">demands, support</text>
  <line x1="140" y1="355" x2="146" y2="355" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output box: produced by Accountability -->
  <rect x="860" y="320" width="120" height="70" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="920" y="350" text-anchor="middle" font-size="14" font-weight="bold">Output</text>
  <text x="920" y="369" text-anchor="middle" font-size="10">regulation, distribution</text>
  <line x1="854" y1="355" x2="860" y2="355" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AI forms as disruption, feeding into all three components separately -->
  <line x1="320" y1="555" x2="320" y2="422" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="500" y1="555" x2="500" y2="235" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="680" y1="555" x2="680" y2="422" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="270" y="555" width="460" height="95" rx="8" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="500" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">AI forms as disruption</text>
  <text x="296" y="602" font-size="11.5"><tspan font-weight="bold" fill="#7a4fb5">1 Generative</tspan><tspan> — interpretation, drafting, synthetic media</tspan></text>
  <text x="296" y="623" font-size="11.5"><tspan font-weight="bold" fill="#b8860b">2 Ranking &amp; Recommendation</tspan><tspan> — exposure, amplification</tspan></text>
  <text x="296" y="644" font-size="11.5"><tspan font-weight="bold" fill="#555">3 Agentic</tspan><tspan> — autonomous action, executing decisions</tspan></text>
</svg>
