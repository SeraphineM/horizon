<svg xmlns="http://www.w3.org/2000/svg" viewBox="-420 -110 1840 870" font-family="Georgia, 'Times New Roman', serif">
  <rect x="-420" y="-110" width="1840" height="870" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrowWP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- background layer: work packages as grey ellipses, moved closer to the centre, each linked by a grey arrow to its home -->
  <g fill="#e2e2e2" stroke="#aaaaaa" stroke-width="1.2">
    <ellipse cx="370" cy="-58" rx="128" ry="38"/>
    <ellipse cx="630" cy="-58" rx="128" ry="38"/>
    <ellipse cx="-140" cy="205" rx="145" ry="58"/>
    <ellipse cx="1140" cy="205" rx="145" ry="58"/>
    <ellipse cx="-200" cy="335" rx="135" ry="54"/>
    <ellipse cx="1200" cy="335" rx="135" ry="54"/>
    <ellipse cx="-150" cy="465" rx="145" ry="58"/>
    <ellipse cx="1150" cy="465" rx="145" ry="58"/>
    <ellipse cx="-70" cy="660" rx="145" ry="54"/>
    <ellipse cx="1070" cy="660" rx="145" ry="54"/>
  </g>

  <!-- connector arrows: each WP's home, drawn before Figure 1 so it appears to originate from its component -->
  <g stroke="#999" stroke-width="1.4" fill="none">
    <path d="M 370,-20 L 440,10" marker-end="url(#arrowWP)"/>
    <path d="M 630,-20 L 630,0 L 945,0 L 945,289" marker-end="url(#arrowWP)"/>
    <path d="M 230,205 L 5,205" marker-end="url(#arrowWP)"/>
    <path d="M 770,205 L 995,205" marker-end="url(#arrowWP)"/>
    <path d="M 230,335 L 230,285 L -65,285 L -65,335" marker-end="url(#arrowWP)"/>
    <path d="M 770,335 L 770,285 L 1065,285 L 1065,335" marker-end="url(#arrowWP)"/>
    <path d="M 230,465 L -5,465" marker-end="url(#arrowWP)"/>
    <path d="M 770,465 L 1005,465" marker-end="url(#arrowWP)"/>
    <path d="M 340,530 L 340,595 L -70,595 L -70,606" marker-end="url(#arrowWP)"/>
    <path d="M 660,530 L 660,595 L 1070,595 L 1070,606" marker-end="url(#arrowWP)"/>
  </g>

  <g fill="#444" font-size="30">
    <text x="370" y="-66" text-anchor="middle" font-weight="bold">WP1</text>
    <text x="370" y="-36" text-anchor="middle" font-size="24">Framework</text>

    <text x="630" y="-66" text-anchor="middle" font-weight="bold">WP10</text>
    <text x="630" y="-36" text-anchor="middle" font-size="24">Dissemination</text>

    <text x="-140" y="189" text-anchor="middle" font-weight="bold">WP2</text>
    <text x="-140" y="225" text-anchor="middle" font-size="24">Citizen Trust</text>

    <text x="1140" y="189" text-anchor="middle" font-weight="bold">WP3</text>
    <text x="1140" y="225" text-anchor="middle" font-size="24">Deliberative Democracy</text>

    <text x="-200" y="321" text-anchor="middle" font-weight="bold">WP4</text>
    <text x="-200" y="355" text-anchor="middle" font-size="24">Disinformation</text>

    <text x="1200" y="321" text-anchor="middle" font-weight="bold">WP5</text>
    <text x="1200" y="355" text-anchor="middle" font-size="24">Evidence Integrity</text>

    <text x="-150" y="451" text-anchor="middle" font-weight="bold">WP6</text>
    <text x="-150" y="485" text-anchor="middle" font-size="24">Repression Monitoring</text>

    <text x="1150" y="451" text-anchor="middle" font-weight="bold">WP7</text>
    <text x="1150" y="485" text-anchor="middle" font-size="24">AI Governance</text>

    <text x="-70" y="646" text-anchor="middle" font-weight="bold">WP8</text>
    <text x="-70" y="680" text-anchor="middle" font-size="24">Resilience Radar</text>

    <text x="1070" y="646" text-anchor="middle" font-weight="bold">WP9</text>
    <text x="1070" y="680" text-anchor="middle" font-size="24">Equitable AI Literacy</text>
  </g>

  <!-- Figure 1, enlarged -->
  <text x="500" y="25" text-anchor="middle" font-size="22" font-weight="bold" fill="#3d2566">How AI Transforms Democratic Resilience</text>

  <path d="M 945,293 V 85 H 55 V 293" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="500" y="62" text-anchor="middle" font-size="15" fill="#666">feedback --- the loop informational resilience of democracy depends on closing</text>

  <text x="500" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#444">Throughput</text>

  <rect x="-30" y="293" width="170" height="85" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="55" y="328" text-anchor="middle" font-size="19" font-weight="bold">Input</text>
  <text x="55" y="352" text-anchor="middle" font-size="15">demands, support</text>
  <line x1="140" y1="335" x2="226" y2="335" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="860" y="293" width="170" height="85" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="945" y="328" text-anchor="middle" font-size="19" font-weight="bold">Output</text>
  <text x="945" y="352" text-anchor="middle" font-size="15">regulation, distribution</text>
  <line x1="774" y1="335" x2="860" y2="335" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="230" y="140" width="540" height="130" fill="#e8ecfa" stroke="#33509b" stroke-width="1.4"/>
  <text x="500" y="175" text-anchor="middle" font-size="21" font-weight="bold" fill="#33509b">Informational Autonomy</text>
  <text x="500" y="205" text-anchor="middle" font-size="18">Participation (elections)</text>
  <text x="500" y="231" text-anchor="middle" font-size="18">Socialisation (civic education)</text>
  <text x="500" y="257" text-anchor="middle" font-size="18">Aggregation (parties)</text>

  <rect x="230" y="270" width="540" height="130" fill="#f2ecfa" stroke="#7a4fb5" stroke-width="1.4"/>
  <text x="500" y="305" text-anchor="middle" font-size="21" font-weight="bold" fill="#7a4fb5">Informational Integrity</text>
  <text x="500" y="352" text-anchor="middle" font-size="18">Communication (media)</text>

  <rect x="230" y="400" width="540" height="130" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.4"/>
  <text x="500" y="435" text-anchor="middle" font-size="21" font-weight="bold" fill="#3d7a44">Informational Accountability</text>
  <text x="500" y="465" text-anchor="middle" font-size="18">Policymaking (legislature)</text>
  <text x="500" y="491" text-anchor="middle" font-size="18">Power (executive)</text>
  <text x="500" y="517" text-anchor="middle" font-size="18">Adjudication (judiciary)</text>

  <line x1="500" y1="615" x2="500" y2="534" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="230" y="615" width="540" height="125" rx="8" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="500" y="642" text-anchor="middle" font-size="18" font-weight="bold" fill="#444">AI forms as disruption</text>
  <text x="256" y="670" font-size="17"><tspan font-weight="bold" fill="#7a4fb5">1 Generative</tspan><tspan> — interpretation, drafting, synthetic media</tspan></text>
  <text x="256" y="697" font-size="17"><tspan font-weight="bold" fill="#b8860b">2 Ranking &amp; Recommendation</tspan><tspan> — exposure, amplification</tspan></text>
  <text x="256" y="724" font-size="17"><tspan font-weight="bold" fill="#555">3 Agentic</tspan><tspan> — autonomous action, executing decisions</tspan></text>
</svg>
