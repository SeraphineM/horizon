<svg xmlns="http://www.w3.org/2000/svg" viewBox="-420 -110 1840 800" font-family="Georgia, 'Times New Roman', serif">
  <rect x="-420" y="-110" width="1840" height="800" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrowWP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- background layer: work packages as grey ellipses, positioned further out, each linked by a grey arrow to its home -->
  <g fill="#e2e2e2" stroke="#aaaaaa" stroke-width="1.2">
    <ellipse cx="380" cy="-55" rx="120" ry="34"/>
    <ellipse cx="620" cy="-55" rx="120" ry="34"/>
    <ellipse cx="-280" cy="195" rx="120" ry="52"/>
    <ellipse cx="1280" cy="195" rx="120" ry="52"/>
    <ellipse cx="-290" cy="305" rx="110" ry="48"/>
    <ellipse cx="1290" cy="305" rx="110" ry="48"/>
    <ellipse cx="-280" cy="415" rx="120" ry="52"/>
    <ellipse cx="1280" cy="415" rx="120" ry="52"/>
    <ellipse cx="-100" cy="600" rx="120" ry="48"/>
    <ellipse cx="1100" cy="600" rx="120" ry="48"/>
  </g>

  <!-- connector arrows: each WP's home, drawn before Figure 1 so it appears to originate from its component -->
  <g stroke="#999" stroke-width="1.4" fill="none">
    <path d="M 380,-21 L 450,10" marker-end="url(#arrowWP)"/>
    <path d="M 620,-21 L 620,0 L 905,0 L 905,268" marker-end="url(#arrowWP)"/>
    <path d="M 270,180 L -160,180" marker-end="url(#arrowWP)"/>
    <path d="M 730,180 L 1160,180" marker-end="url(#arrowWP)"/>
    <path d="M 270,280 L 270,258 L -180,258 L -180,305" marker-end="url(#arrowWP)"/>
    <path d="M 730,280 L 730,258 L 1180,258 L 1180,305" marker-end="url(#arrowWP)"/>
    <path d="M 270,415 L -160,415" marker-end="url(#arrowWP)"/>
    <path d="M 730,415 L 1160,415" marker-end="url(#arrowWP)"/>
    <path d="M 340,470 L 340,510 L -100,510 L -100,552" marker-end="url(#arrowWP)"/>
    <path d="M 660,470 L 660,510 L 1100,510 L 1100,552" marker-end="url(#arrowWP)"/>
  </g>

  <g fill="#444" font-size="20">
    <text x="380" y="-64" text-anchor="middle" font-weight="bold">WP1</text>
    <text x="380" y="-42" text-anchor="middle" font-size="17">Framework</text>

    <text x="620" y="-64" text-anchor="middle" font-weight="bold">WP10</text>
    <text x="620" y="-42" text-anchor="middle" font-size="17">Dissemination</text>

    <text x="-280" y="182" text-anchor="middle" font-weight="bold">WP2</text>
    <text x="-280" y="209" text-anchor="middle" font-size="17">Citizen Trust</text>

    <text x="1280" y="182" text-anchor="middle" font-weight="bold">WP3</text>
    <text x="1280" y="209" text-anchor="middle" font-size="16.5">Deliberative Democracy</text>

    <text x="-290" y="291" text-anchor="middle" font-weight="bold">WP4</text>
    <text x="-290" y="320" text-anchor="middle" font-size="16.5">Disinformation</text>

    <text x="1290" y="291" text-anchor="middle" font-weight="bold">WP5</text>
    <text x="1290" y="320" text-anchor="middle" font-size="16.5">Evidence Integrity</text>

    <text x="-280" y="402" text-anchor="middle" font-weight="bold">WP6</text>
    <text x="-280" y="430" text-anchor="middle" font-size="16.5">Repression Monitoring</text>

    <text x="1280" y="402" text-anchor="middle" font-weight="bold">WP7</text>
    <text x="1280" y="430" text-anchor="middle" font-size="17">AI Governance</text>

    <text x="-100" y="590" text-anchor="middle" font-weight="bold">WP8</text>
    <text x="-100" y="620" text-anchor="middle" font-size="17">Resilience Radar</text>

    <text x="1100" y="590" text-anchor="middle" font-weight="bold">WP9</text>
    <text x="1100" y="620" text-anchor="middle" font-size="16.5">Equitable AI Literacy</text>
  </g>

  <!-- Figure 1, reproduced exactly as published -->
  <text x="500" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#3d2566">How AI Transforms Democratic Resilience</text>

  <path d="M 905,270 V 85 H 95 V 270" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#666">feedback -- the loop democratic resilience depends on closing</text>

  <text x="500" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Throughput</text>

  <rect x="20" y="270" width="150" height="70" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="95" y="300" text-anchor="middle" font-size="14" font-weight="bold">Input</text>
  <text x="95" y="319" text-anchor="middle" font-size="10">demands, support</text>
  <line x1="170" y1="305" x2="266" y2="305" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="830" y="270" width="150" height="70" rx="10" fill="#f2f2f2" stroke="#666" stroke-width="1.3"/>
  <text x="905" y="300" text-anchor="middle" font-size="14" font-weight="bold">Output</text>
  <text x="905" y="319" text-anchor="middle" font-size="10">regulation, distribution</text>
  <line x1="734" y1="305" x2="830" y2="305" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="270" y="140" width="460" height="110" fill="#e8ecfa" stroke="#33509b" stroke-width="1.4"/>
  <text x="500" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#33509b">Informational Autonomy</text>
  <text x="500" y="198" text-anchor="middle" font-size="12">Participation (elections)</text>
  <text x="500" y="218" text-anchor="middle" font-size="12">Socialisation (civic education)</text>
  <text x="500" y="238" text-anchor="middle" font-size="12">Aggregation (parties)</text>

  <rect x="270" y="250" width="460" height="110" fill="#f2ecfa" stroke="#7a4fb5" stroke-width="1.4"/>
  <text x="500" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4fb5">Informational Integrity</text>
  <text x="500" y="318" text-anchor="middle" font-size="12">Communication (media)</text>

  <rect x="270" y="360" width="460" height="110" fill="#e7f3e9" stroke="#3d7a44" stroke-width="1.4"/>
  <text x="500" y="393" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d7a44">Informational Accountability</text>
  <text x="500" y="418" text-anchor="middle" font-size="12">Policymaking (legislature)</text>
  <text x="500" y="438" text-anchor="middle" font-size="12">Power (executive)</text>
  <text x="500" y="458" text-anchor="middle" font-size="12">Adjudication (judiciary)</text>

  <line x1="500" y1="555" x2="500" y2="474" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="270" y="555" width="460" height="95" rx="8" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="500" y="578" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">AI forms as disruption</text>
  <text x="296" y="602" font-size="11.5"><tspan font-weight="bold" fill="#7a4fb5">1 Generative</tspan><tspan> — interpretation, drafting, synthetic media</tspan></text>
  <text x="296" y="623" font-size="11.5"><tspan font-weight="bold" fill="#b8860b">2 Ranking &amp; Recommendation</tspan><tspan> — exposure, amplification</tspan></text>
  <text x="296" y="644" font-size="11.5"><tspan font-weight="bold" fill="#555">3 Agentic</tspan><tspan> — autonomous action, executing decisions</tspan></text>
</svg>
